<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div
        style="font-family: Arial, sans-serif; font-size: 16px; color: #333; line-height: 1.6; max-width: 900px; width: 100%;">
        <p>Dear <strong style="font-size: 18px; color: #000;">${name}</strong>,</p>
        <p>Thank you for registering at <strong>ShopMix</strong>! Please confirm your email by clicking the button
            below:</p>
        <p style="margin-top: 20px;">
            <a href="${url}" style="display: block; padding: 14px 0; text-align: center; font-size: 18px; color: white; 
                background: #071263; text-decoration: none; border-radius: 4px; font-weight: bold;">
                Verify Email
            </a>
        </p>
        <p>If you didn't sign up for ShopMix, please ignore this email.</p>
        <p>Best regards,</p>
        <p><strong>The ShopMix Team</strong></p>
    </div>
</body>

</html>
